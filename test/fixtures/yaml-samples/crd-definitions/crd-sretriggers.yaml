apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: sretriggers.kaddie.org
spec:
  group: kaddie.org
  scope: Cluster
  names:
    kind: SRETrigger
    listKind: SRETriggerList
    plural: sretriggers
    singular: sretrigger
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - { name: Mode, type: string, jsonPath: .spec.mode }
        - { name: Valid, type: string, jsonPath: ".status.conditions[?(@.type=='Valid')].status" }
        - { name: Firing, type: integer, jsonPath: .status.firingInstances }
        - { name: FiredToday, type: integer, jsonPath: .status.firedToday }
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            apiVersion: { type: string }
            kind: { type: string }
            metadata: { type: object }
            spec:
              type: object
              required: [session]
              x-kubernetes-validations:
                - rule: "[has(self.watch), has(self.schedule), has(self.webhook)].filter(x, x).size() == 1"
                  message: exactly one of watch, schedule or webhook must be set
                - rule: "!has(self.session.resume) || self.session.resume != 'ProposalSession' || (has(self.watch) && self.watch.resource == 'sreproposals')"
                  message: ProposalSession resume requires a watch on sreproposals
              properties:
                mode: { type: string, enum: [Shadow, Active], default: Shadow }
                watch:
                  type: object
                  required: [apiVersion, resource, when]
                  properties:
                    apiVersion: { type: string }
                    resource: { type: string }
                    namespaceSelector:
                      type: object
                      properties:
                        matchLabels: { type: object, additionalProperties: { type: string } }
                        matchExpressions:
                          type: array
                          items:
                            type: object
                            properties:
                              key: { type: string }
                              operator: { type: string, enum: [In, NotIn, Exists, DoesNotExist] }
                              values: { type: array, items: { type: string } }
                    when: { type: string, maxLength: 4096 }
                    for: { type: string, pattern: "^([0-9]+(s|m|h))+$" }
                    subject: { type: string, maxLength: 4096 }
                schedule:
                  type: object
                  required: [cron]
                  properties:
                    cron: { type: string, maxLength: 100 }
                    timezone: { type: string, default: UTC }
                webhook:
                  type: object
                  required: [path, auth, when]
                  properties:
                    path: { type: string, pattern: "^[a-z0-9-]{1,63}$" }
                    auth:
                      type: object
                      required: [type, secretName]
                      properties:
                        type: { type: string, enum: [Bearer, HMAC] }
                        secretName: { type: string }
                    when: { type: string, maxLength: 4096 }
                    subject: { type: string, maxLength: 4096, default: payload.name }
                    expireAfter: { type: string, pattern: "^([0-9]+(s|m|h))+$", default: 24h }
                session:
                  type: object
                  properties:
                    goal: { type: string, maxLength: 2000 }
                    resume: { type: string, enum: [None, ProposalSession], default: None }
                controls:
                  type: object
                  properties:
                    cooldown: { type: string, pattern: "^([0-9]+(s|m|h))+$" }
            status:
              type: object
              properties:
                lastFired: { type: string, format: date-time }
                instances: { type: integer }
                firingInstances: { type: integer }
                firedToday: { type: integer }
                suppressedToday: { type: object, additionalProperties: { type: integer } }
                conditions:
                  type: array
                  items:
                    type: object
                    required: [type, status]
                    properties:
                      type: { type: string }
                      status: { type: string, enum: ["True", "False", "Unknown"] }
                      reason: { type: string }
                      message: { type: string }
