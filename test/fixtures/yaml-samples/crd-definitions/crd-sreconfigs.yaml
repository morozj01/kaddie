apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: sreconfigs.kaddie.org
spec:
  group: kaddie.org
  scope: Cluster
  names:
    kind: SREConfig
    listKind: SREConfigList
    plural: sreconfigs
    singular: sreconfig
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - { name: Mode, type: string, jsonPath: .spec.mode }
        - { name: TriggersPaused, type: boolean, jsonPath: .spec.triggersPaused }
        - { name: ChangedBy, type: string, jsonPath: .spec.changedBy }
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion: { type: string }
            kind: { type: string }
            metadata:
              type: object
              properties:
                name: { type: string, enum: [default] }
            spec:
              type: object
              default: {}
              properties:
                mode: { type: string, enum: [Enabled, ExecutionPaused, Halted], default: Halted }
                reason: { type: string, maxLength: 1024 }
                changedBy: { type: string, maxLength: 253 }
                triggersPaused: { type: boolean, default: false }
                api:
                  type: object
                  default: {}
                  properties:
                    enabled: { type: boolean, default: true }
                repositories:
                  type: array
                  default: []
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [name]
                  items:
                    type: object
                    required: [name, url, targetBranch]
                    properties:
                      name: { type: string, maxLength: 63 }
                      url: { type: string, maxLength: 1024, x-kubernetes-validations: [{ rule: "!self.contains('@') || self.startsWith('ssh://') || self.startsWith('git@')", message: "credentials must not appear in the URL" }] }
                      targetBranch: { type: string, maxLength: 255 }
                      readablePaths: { type: array, items: { type: string }, default: [] }
                      editablePaths: { type: array, items: { type: string }, default: [] }
                      editableExtensions: { type: array, items: { type: string }, default: [".yaml", ".yml", ".json"] }
                      protectedPaths: { type: array, items: { type: string }, default: [] }
                      pr:
                        type: object
                        default: {}
                        properties:
                          branchPrefix: { type: string, enum: [kaddie/], default: kaddie/ }
                          minRequiredApprovals: { type: integer, minimum: 1, default: 1 }
                          labels: { type: array, items: { type: string }, default: [] }
                          includeJustification: { type: boolean, default: true }
                          attestations: { type: array, items: { type: string }, default: [] }
                      deployTargets:
                        type: array
                        default: []
                        items:
                          type: object
                          required: [name, path, destinationNamespace, local]
                          properties:
                            name: { type: string }
                            trackedRevision: { type: string }
                            path: { type: string }
                            tool: { type: string, enum: [Plain, Helm, Kustomize] }
                            valueFiles: { type: array, items: { type: string }, default: [] }
                            destinationNamespace: { type: string }
                            local: { type: boolean }
