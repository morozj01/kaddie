apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kaddie-tools
rules:
  - apiGroups: [kaddie.org]
    resources: [sreconfigs]
    verbs: [get, list, watch]
  - apiGroups: [kaddie.org]
    resources: [sreproposals]
    verbs: [get, list, watch]
  - apiGroups: [authentication.k8s.io]
    resources: [tokenreviews]
    verbs: [create]
