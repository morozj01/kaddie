apiVersion: kaddie.org/v1alpha1
kind: SREConfig
metadata:
  name: default
spec:
  mode: Enabled
  reason: "Enabled after the platform team's review"
  changedBy: bob@example.com
  triggersPaused: false
  api:
    enabled: true
  repositories:
    - name: platform-config
      url: https://git.example.com/org/platform-config.git
      targetBranch: main
      protectedPaths:
        - "apps/*/base/**"
        - "secrets/**"
      pr:
        branchPrefix: kaddie/
        minRequiredApprovals: 2
        labels: [kaddie-agent]
        includeJustification: true
        attestations: []
      deployPaths:
        - name: payments-prod
          path: apps/payments/overlays/prod
          tool: Kustomize
          namespace: payments
          extraArgs: []
        - name: billing
          path: charts/billing
          tool: Helm
          namespace: billing
          extraArgs:
            - --name-template=billing
            - --values=values-prod.yaml
            - --kube-version=1.30.0
