          - { verb: delete, apiVersion: v1, resource: configmaps, namespace: payments, name: c6 }
          - { verb: delete, apiVersion: v1, resource: configmaps, namespace: payments, name: c7 }
          - { verb: delete, apiVersion: v1, resource: configmaps, namespace: payments, name: c8 }
          - { verb: delete, apiVersion: v1, resource: configmaps, namespace: payments, name: c9 }
          - { verb: delete, apiVersion: v1, resource: configmaps, namespace: payments, name: c10 }
