- name: 'Malformed: the verb is create, patch or delete'
  tests: [T11]
  proposal:
    spec:
      type: Api
      api:
        requests:
          - {verb: update, apiVersion: v1, resource: configmaps, namespace: payments, name: c, body: '{"data":{"a":"b"}}'}
      justification: A test proposal.
  static:
    - {reason: Malformed, request: 0}

- name: 'Malformed: patch and delete need a name'
  tests: [T11]
  proposal:
    spec:
      type: Api
      api:
        requests:
          - {verb: patch, apiVersion: v1, resource: configmaps, namespace: payments, patchType: application/merge-patch+json, body: '{"data":{"a":"b"}}'}
          - {verb: delete, apiVersion: v1, resource: configmaps, namespace: payments}
      justification: A test proposal.
  static:
    - {reason: Malformed, request: 0}
    - {reason: Malformed, request: 1}

- name: 'Malformed: patch needs a patch type, one of the three'
  tests: [T11]
  proposal:
    spec:
      type: Api
      api:
        requests:
          - {verb: patch, apiVersion: v1, resource: configmaps, namespace: payments, name: c, body: '{"data":{"a":"b"}}'}
          - {verb: patch, apiVersion: v1, resource: configmaps, namespace: payments, name: c, patchType: application/apply-patch+yaml, body: '{"data":{"a":"b"}}'}
      justification: A test proposal.
  static:
    - {reason: Malformed, request: 0}
    - {reason: Malformed, request: 1}

- name: 'Malformed: create and patch need a body, which is then not valid JSON either'
  tests: [T11]
  proposal:
    spec:
      type: Api
      api:
        requests:
          - {verb: create, apiVersion: v1, resource: configmaps, namespace: payments}
          - {verb: patch, apiVersion: v1, resource: configmaps, namespace: payments, name: c, patchType: application/merge-patch+json}
      justification: A test proposal.
  static:
    - {reason: Malformed, request: 0}
    - {reason: InvalidJSON, request: 0}
    - {reason: Malformed, request: 1}
    - {reason: InvalidJSON, request: 1}

# A request with no target can't match a protection, so only the last one is a Secret request.
- name: "Malformed: the apiVersion is v1 or group/version, and then the target isn't matched"
  tests: [T11]
  proposal:
    spec:
      type: Api
      api:
        requests:
          - {verb: delete, apiVersion: apps, resource: secrets, namespace: payments, name: s}
          - {verb: delete, apiVersion: "", resource: secrets, namespace: payments, name: s}
          - {verb: delete, apiVersion: a/b/c, resource: secrets, namespace: payments, name: s}
          - {verb: delete, apiVersion: '/v1', resource: secrets, namespace: payments, name: s}
          - {verb: delete, apiVersion: v1, resource: secrets, namespace: payments, name: s}
      justification: A test proposal.
  static:
    - {reason: Malformed, request: 0}
    - {reason: Malformed, request: 1}
    - {reason: Malformed, request: 2}
    - {reason: Malformed, request: 3}
    - {reason: Secret, request: 4}

- name: 'Malformed: the resource is required'
  tests: [T11]
  proposal:
    spec:
      type: Api
      api:
        requests:
          - {verb: delete, apiVersion: v1, resource: "", namespace: payments, name: x}
      justification: A test proposal.
  static:
    - {reason: Malformed, request: 0}

- name: "Malformed: body hygiene runs on a request whose apiVersion doesn't parse"
  tests: [T11, T34]
  proposal:
    spec:
      type: Api
      api:
        requests:
          - {verb: create, apiVersion: apps, resource: configmaps, namespace: payments, body: '{"data":{"a":"<redacted:x>"}}'}
      justification: A test proposal.
  static:
    - {reason: Malformed, request: 0}
    - {reason: RedactedPlaceholder, request: 0}

# A cluster-scoped resource has no namespace; a subresource is optional.
- name: 'Malformed near miss: a well-formed request of each verb'
  tests: [T11]
  proposal:
    spec:
      type: Api
      api:
        requests:
          - {verb: create, apiVersion: v1, resource: configmaps, namespace: payments, body: '{"metadata":{"name":"c"}}'}
          - {verb: patch, apiVersion: v1, resource: configmaps, namespace: payments, name: c, patchType: application/merge-patch+json, body: '{"data":{"a":"b"}}'}
          - {verb: delete, apiVersion: v1, resource: configmaps, namespace: payments, name: c}
          - {verb: delete, apiVersion: v1, resource: namespaces, name: scratch}
          - {verb: patch, apiVersion: apps/v1, resource: deployments, subresource: scale, namespace: payments, name: api, patchType: application/merge-patch+json, body: '{"spec":{"replicas":2}}'}
      justification: A test proposal.
  static: []
