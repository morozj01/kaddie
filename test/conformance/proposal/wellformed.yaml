          - { verb: delete, apiVersion: v1, resource: configmaps, namespace: payments, name: c13 }
          - { verb: delete, apiVersion: v1, resource: configmaps, namespace: payments, name: c14 }
          - { verb: delete, apiVersion: v1, resource: configmaps, namespace: payments, name: c15 }
