# Well-formedness (base 4.1 and 6.1), re-checked so no client depends on the
# CRD schema being installed correctly. A violation names its request when it
# is about one, and is NoRequest (-1) otherwise. The protections still run on
# a malformed request wherever they can. Limits on lengths and sizes are in the
# Go tests, which generate their inputs.

- name: 'Malformed: the type must be Api or Git'
  tests: [T11]
  proposal:
    spec:
      type: Other
      api:
        requests:
          - { verb: delete, apiVersion: v1, resource: configmaps, namespace: payments, name: c }
      justification: j
  static:
    - {reason: Malformed, request: -1}

- name: 'Malformed: an Api proposal needs an api block'
  tests: [T11]
  proposal:
    spec:
      type: Api
      git:
        repository: platform
        baseSHA: 0123456789abcdef0123456789abcdef01234567
        edits:
          - { path: a.yaml, operation: Delete }
      justification: j
  static:
    - {reason: Malformed, request: -1}

- name: "Malformed: an Api proposal can't also have a git block"
  tests: [T11]
  proposal:
    spec:
      type: Api
      api:
        requests:
          - { verb: delete, apiVersion: v1, resource: configmaps, namespace: payments, name: c }
      git:
        repository: platform
        baseSHA: 0123456789abcdef0123456789abcdef01234567
        edits:
          - { path: a.yaml, operation: Delete }
      justification: j
  static:
    - {reason: Malformed, request: -1}

- name: 'Malformed: a Git proposal needs a git block'
  tests: [T11]
  proposal:
    spec:
      type: Git
      api:
        requests:
          - { verb: delete, apiVersion: v1, resource: configmaps, namespace: payments, name: c }
      justification: j
  static:
    - {reason: Malformed, request: -1}

- name: "Malformed: a Git proposal can't also have an api block"
  tests: [T11]
  proposal:
    spec:
      type: Git
      git:
        repository: platform
        baseSHA: 0123456789abcdef0123456789abcdef01234567
        edits:
          - { path: a.yaml, operation: Delete }
      api:
        requests:
          - { verb: delete, apiVersion: v1, resource: configmaps, namespace: payments, name: c }
      justification: j
  static:
    - {reason: Malformed, request: -1}

- name: 'Malformed: an Api proposal needs at least one request'
  tests: [T11]
  proposal:
    spec:
      type: Api
      api:
        requests: []
      justification: j
  static:
    - {reason: Malformed, request: -1}

