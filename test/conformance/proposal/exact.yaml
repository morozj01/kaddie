          replicas: 3
          selector: {matchLabels: {app: api}}
          template:
            metadata: {labels: {app: api}}
            spec:
              containers:
                - name: app
                  image: "nginx:1.27"
        status: {replicas: 3, observedGeneration: 5}
  static: []
  exact: []

# Exact evaluation is more precise than static: only the pod template's label really changed.
- name: "T40 replacing spec.template with identical content and a label change: static flags every field beneath it, exact flags none"
  tests: [T40]
  proposal:
    spec:
      type: Api
      api:
        requests:
          - {verb: patch, apiVersion: apps/v1, resource: deployments, namespace: payments, name: api, patchType: application/json-patch+json, body: '[{"op":"replace","path":"/spec/template","value":{"metadata":{"labels":{"app":"api","tier":"web"}},"spec":{"containers":[{"name":"app","image":"nginx:1.27"}]}}}]'}
      justification: A test proposal.
  observed:
    - request: 0
      live:
        apiVersion: apps/v1
        kind: Deployment
        metadata: {name: api, namespace: payments, resourceVersion: "100", generation: 4}
        spec:
          replicas: 2
          selector: {matchLabels: {app: api}}
          template:
            metadata: {labels: {app: api}}
            spec:
              containers:
                - name: app
                  image: "nginx:1.27"
        status: {replicas: 2, observedGeneration: 4}
      dryRun:
        apiVersion: apps/v1
        kind: Deployment
        metadata: {name: api, namespace: payments, resourceVersion: "101", generation: 5}
        spec:
          replicas: 2
          selector: {matchLabels: {app: api}}
          template:
            metadata: {labels: {app: api, tier: web}}
            spec:
              containers:
                - name: app
                  image: "nginx:1.27"
        status: {replicas: 2, observedGeneration: 5}
  static:
    - {reason: WorkloadField, request: 0, field: '**.containers[*].image'}
    - {reason: WorkloadField, request: 0, field: '**.initContainers[*].image'}
    - {reason: WorkloadField, request: 0, field: '**.ephemeralContainers[*]'}
    - {reason: WorkloadField, request: 0, field: '**.containers[*].command'}
    - {reason: WorkloadField, request: 0, field: '**.containers[*].args'}
    - {reason: WorkloadField, request: 0, field: '**.containers[*].env'}
    - {reason: WorkloadField, request: 0, field: '**.containers[*].envFrom'}
    - {reason: WorkloadField, request: 0, field: '**.containers[*].volumeMounts'}
    - {reason: WorkloadField, request: 0, field: '**.containers[*].securityContext'}
    - {reason: WorkloadField, request: 0, field: '**.initContainers[*].command'}
    - {reason: WorkloadField, request: 0, field: '**.initContainers[*].args'}
    - {reason: WorkloadField, request: 0, field: '**.initContainers[*].env'}
    - {reason: WorkloadField, request: 0, field: '**.initContainers[*].envFrom'}
    - {reason: WorkloadField, request: 0, field: '**.initContainers[*].volumeMounts'}
    - {reason: WorkloadField, request: 0, field: '**.initContainers[*].securityContext'}
    - {reason: WorkloadField, request: 0, field: '**.volumes'}
    - {reason: WorkloadField, request: 0, field: '**.serviceAccountName'}
    - {reason: WorkloadField, request: 0, field: '**.automountServiceAccountToken'}
    - {reason: WorkloadField, request: 0, field: '**.hostNetwork'}
    - {reason: WorkloadField, request: 0, field: '**.hostPID'}
    - {reason: WorkloadField, request: 0, field: '**.hostIPC'}
    - {reason: WorkloadField, request: 0, field: '**.nodeName'}
    - {reason: WorkloadField, request: 0, field: '**.securityContext'}
  exact: []

# The test operation fails against the live object, so Apply fails and the whole difference between live and the dry run is the request's.
- name: "T40 when the patch can't be applied client-side, everything the dry run shows counts as the request's own"
  tests: [T40]
  proposal:
    spec:
      type: Api
      api:
        requests:
          - {verb: patch, apiVersion: apps/v1, resource: deployments, namespace: payments, name: api, patchType: application/json-patch+json, body: '[{"op":"test","path":"/spec/replicas","value":5},{"op":"replace","path":"/spec/replicas","value":3}]'}
      justification: A test proposal.
  observed:
    - request: 0
      live:
        apiVersion: apps/v1
        kind: Deployment
        metadata: {name: api, namespace: payments, resourceVersion: "100", generation: 4}
        spec:
          replicas: 2
          selector: {matchLabels: {app: api}}
          template:
            metadata: {labels: {app: api}}
            spec:
              containers:
                - name: app
                  image: "nginx:1.27"
        status: {replicas: 2, observedGeneration: 4}
      dryRun:
        apiVersion: apps/v1
        kind: Deployment
        metadata: {name: api, namespace: payments, resourceVersion: "101", generation: 5}
        spec:
          replicas: 3
          selector: {matchLabels: {app: api}}
          template:
            metadata: {labels: {app: api}}
            spec:
              containers:
                - name: app
                  image: "registry.example.net/mirror/nginx:1.27"
        status: {replicas: 2, observedGeneration: 5}
  static: []
  exact:
    - {reason: WorkloadField, request: 0, field: '**.containers[*].image', source: Request}

# The dry run adds serviceAccountName, volumes and securityContext, all protected. The body sets none of them, so they are defaults, and only the body's own image is reported.
- name: "T40 a create's fields the server defaults but the body doesn't set are not findings"
  tests: [T40]
  proposal:
    spec:
      type: Api
      api:
        requests:
          - {verb: create, apiVersion: v1, resource: pods, namespace: payments, body: '{"metadata":{"name":"web"},"spec":{"containers":[{"name":"app","image":"nginx:1.27"}]}}'}
      justification: A test proposal.
  observed:
    - request: 0
      dryRun:
        apiVersion: v1
        kind: Pod
        metadata: {name: web, namespace: payments, uid: "5d2f", resourceVersion: "7", creationTimestamp: "2026-11-11T09:00:00Z"}
        spec:
          containers:
            - {name: app, image: "nginx:1.27", imagePullPolicy: IfNotPresent, terminationMessagePath: /dev/termination-log}
          dnsPolicy: ClusterFirst
          restartPolicy: Always
          schedulerName: default-scheduler
          securityContext: {}
          serviceAccount: default
          serviceAccountName: default
          volumes:
            - {name: kube-api-access-x7k2p, projected: {defaultMode: 420, sources: [{serviceAccountToken: {expirationSeconds: 3607, path: token}}]}}
        status: {phase: Pending}
  static:
    - {reason: WorkloadField, request: 0, field: '**.containers[*].image'}
  exact:
    - {reason: WorkloadField, request: 0, field: '**.containers[*].image', source: Request}

