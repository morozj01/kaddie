# Exact evaluation (base 4.2.1 item 2, T2.6): the findings from what a
# server-side dry run really changed. observed.live is the object before the
# request, observed.dryRun the object the dry run returned. A finding's source
# is Request when the request's own change (what applying it client-side does
# to live) matches the protected path, Admission when only the rest of the
# difference to the dry run does. A create's own changes are the body's fields;
# server defaults it leaves unset don't count. static is what EvaluateStatic
# returns for the same proposal.

# Static sees a replicas change only. The dry run shows the image changed too, which the client-side application of the patch does not, so admission did it.
- name: "T40 a webhook rewrites a container image the patch did not touch"
  tests: [T40]
  proposal:
    spec:
      type: Api
      api:
        requests:
          - {verb: patch, apiVersion: apps/v1, resource: deployments, namespace: payments, name: api, patchType: application/strategic-merge-patch+json, body: '{"spec":{"replicas":3}}'}
      justification: A test proposal.
  observed:
    - request: 0
      live:
        apiVersion: apps/v1
        kind: Deployment
        metadata: {name: api, namespace: payments, resourceVersion: "100", generation: 4}
        spec:
          replicas: 2
          selector: {matchLabels: {app: api}}
          template:
            metadata: {labels: {app: api}}
            spec:
              containers:
                - name: app
                  image: "nginx:1.27"
        status: {replicas: 2, observedGeneration: 4}
      dryRun:
        apiVersion: apps/v1
        kind: Deployment
        metadata: {name: api, namespace: payments, resourceVersion: "101", generation: 5}
        spec:
          replicas: 3
          selector: {matchLabels: {app: api}}
          template:
            metadata: {labels: {app: api}}
            spec:
              containers:
                - name: app
                  image: "registry.example.net/mirror/nginx:1.27"
        status: {replicas: 2, observedGeneration: 5}
  static: []
  exact:
    - {reason: WorkloadField, request: 0, field: '**.containers[*].image', source: Admission}

# The patch changes the image, so that finding is the request's. A webhook then injects an env var the patch did not carry: that finding is admission's.
- name: "T40 a patch that changes the image itself is the request's finding, a webhook's other change is admission's"
  tests: [T40]
  proposal:
    spec:
      type: Api
      api:
        requests:
          - {verb: patch, apiVersion: apps/v1, resource: deployments, namespace: payments, name: api, patchType: application/strategic-merge-patch+json, body: '{"spec":{"template":{"spec":{"containers":[{"name":"app","image":"nginx:1.28"}]}}}}'}
      justification: A test proposal.
  observed:
    - request: 0
      live:
        apiVersion: apps/v1
        kind: Deployment
        metadata: {name: api, namespace: payments, resourceVersion: "100", generation: 4}
        spec:
          replicas: 2
          selector: {matchLabels: {app: api}}
          template:
            metadata: {labels: {app: api}}
            spec:
              containers:
                - name: app
                  image: "nginx:1.27"
        status: {replicas: 2, observedGeneration: 4}
      dryRun:
        apiVersion: apps/v1
        kind: Deployment
        metadata: {name: api, namespace: payments, resourceVersion: "101", generation: 5}
        spec:
          replicas: 2
          selector: {matchLabels: {app: api}}
          template:
            metadata: {labels: {app: api}}
            spec:
              containers:
                - name: app
                  image: "nginx:1.28"
                  env:
                    - {name: HTTP_PROXY, value: "http://proxy.example.net:3128"}
        status: {replicas: 2, observedGeneration: 5}
  static:
    - {reason: WorkloadField, request: 0, field: '**.containers[*].image'}
  exact:
    - {reason: WorkloadField, request: 0, field: '**.containers[*].image', source: Request}
    - {reason: WorkloadField, request: 0, field: '**.containers[*].env', source: Admission}

