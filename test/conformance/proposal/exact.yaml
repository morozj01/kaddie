# metadata.annotations is not protected; metadata bookkeeping, status and managedFields are ignored.
- name: "T40 a dry run that shows only what the patch does has no exact findings, whatever bookkeeping and unprotected fields admission touches"
  tests: [T40]
  proposal:
    spec:
      type: Api
      api:
        requests:
          - {verb: patch, apiVersion: apps/v1, resource: deployments, namespace: payments, name: api, patchType: application/strategic-merge-patch+json, body: '{"spec":{"replicas":3}}'}
      justification: A test proposal.
  observed:
    - request: 0
      live:
        apiVersion: apps/v1
        kind: Deployment
        metadata: {name: api, namespace: payments, resourceVersion: "100", generation: 4}
        spec:
          replicas: 2
          selector: {matchLabels: {app: api}}
          template:
            metadata: {labels: {app: api}}
            spec:
              containers:
                - name: app
                  image: "nginx:1.27"
        status: {replicas: 2, observedGeneration: 4}
      dryRun:
        apiVersion: apps/v1
        kind: Deployment
        metadata: {name: api, namespace: payments, resourceVersion: "101", generation: 5, annotations: {"example.com/audited": "true"}, uid: "7c1e", creationTimestamp: "2026-11-11T09:00:00Z", managedFields: [{manager: kubectl, operation: Update}]}
