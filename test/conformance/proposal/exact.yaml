# Exact evaluation judges the role the dry run returns: every rule passes the read-role rule and there is no aggregationRule.
- name: "T25 exact: a patch adding a read-only rule, whose resulting role passes, is not flagged"
  tests: [T25]
  proposal:
    spec:
      type: Api
      api:
        requests:
          - {verb: patch, apiVersion: rbac.authorization.k8s.io/v1, resource: clusterroles, name: kaddie-agent-read, patchType: application/json-patch+json, body: '[{"op":"add","path":"/rules/-","value":{"apiGroups":["cert-manager.io"],"resources":["certificates"],"verbs":["get","list","watch"]}}]'}
      justification: A test proposal.
  observed:
    - request: 0
      live:
        apiVersion: rbac.authorization.k8s.io/v1
        kind: ClusterRole
        metadata: {name: kaddie-agent-read, resourceVersion: "9"}
        rules:
          - {apiGroups: [""], resources: [pods, events], verbs: [get, list, watch]}
          - {apiGroups: [apps], resources: [deployments], verbs: [get, list, watch]}
      dryRun:
        apiVersion: rbac.authorization.k8s.io/v1
        kind: ClusterRole
        metadata: {name: kaddie-agent-read, resourceVersion: "9"}
        rules:
          - {apiGroups: [""], resources: [pods, events], verbs: [get, list, watch]}
          - {apiGroups: [apps], resources: [deployments], verbs: [get, list, watch]}
          - {apiGroups: [cert-manager.io], resources: [certificates], verbs: [get, list, watch]}
  static: []
  exact: []

