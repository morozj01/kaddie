  proposal:
    spec:
      type: Api
      api:
        requests:
          - {verb: patch, apiVersion: rbac.authorization.k8s.io/v1, resource: clusterroles, name: kaddie-agent-write, patchType: application/json-patch+json, body: '[{"op":"add","path":"/rules/-","value":{"apiGroups":[""],"resources":["pods"],"verbs":["get"]}}]'}
          - {verb: create, apiVersion: rbac.authorization.k8s.io/v1, resource: clusterroles, body: '{"metadata":{"name":"kaddie-agent-read"},"rules":[]}'}
      justification: A test proposal.
  observed:
    - request: 0
      live:
        apiVersion: rbac.authorization.k8s.io/v1
        kind: ClusterRole
        metadata: {name: kaddie-agent-write, resourceVersion: "9"}
        rules:
          - {apiGroups: [""], resources: [pods, events], verbs: [get, list, watch]}
          - {apiGroups: [apps], resources: [deployments], verbs: [get, list, watch]}
      dryRun:
        apiVersion: rbac.authorization.k8s.io/v1
        kind: ClusterRole
        metadata: {name: kaddie-agent-write, resourceVersion: "9"}
        rules:
          - {apiGroups: [""], resources: [pods, events], verbs: [get, list, watch]}
          - {apiGroups: [apps], resources: [deployments], verbs: [get, list, watch]}
          - {apiGroups: [""], resources: [pods], verbs: [get]}
    - request: 1
      dryRun:
        apiVersion: rbac.authorization.k8s.io/v1
        kind: ClusterRole
        metadata: {name: kaddie-agent-read, resourceVersion: "9"}
        rules:
  static:
    - {reason: RBAC, request: 0}
    - {reason: RBAC, request: 1}
  exact:
    - {reason: RBAC, request: 0, source: Request}
    - {reason: RBAC, request: 1, source: Request}

