# The same inside a patch: a repeated key in a merge patch, a strategic merge patch or a JSON Patch operation is invalid, so the patch changes the root.
- name: 'T11 a patch whose body repeats a key can hold every workload field'
  tests: [T11, T37]
  proposal:
    spec:
      type: Api
      api:
        requests:
          - {verb: patch, apiVersion: apps/v1, resource: deployments, namespace: payments, name: api, patchType: application/merge-patch+json, body: '{"spec":{"replicas":3},"spec":{"paused":false}}'}
          - {verb: patch, apiVersion: apps/v1, resource: deployments, namespace: payments, name: api, patchType: application/strategic-merge-patch+json, body: '{"spec":{"replicas":3,"replicas":4}}'}
          - {verb: patch, apiVersion: apps/v1, resource: deployments, namespace: payments, name: api, patchType: application/json-patch+json, body: '[{"op":"replace","path":"/spec/replicas","value":3,"path":"/spec/template/spec/serviceAccountName"}]'}
      justification: A test proposal.
  static:
    - {reason: InvalidJSON, request: 0}
    - {reason: InvalidJSON, request: 1}
