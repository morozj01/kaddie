          - {verb: patch, apiVersion: batch/v1, resource: jobs, namespace: payments, name: once, patchType: application/json-patch+json, body: '[{"op":"replace","path":"/spec/template","value":{"spec":{}}}]'}
      justification: A test proposal.
  static:
