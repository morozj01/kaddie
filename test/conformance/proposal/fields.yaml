# Object metadata can't hold a protected field, so replacing it, whole or in part, isn't flagged.
- name: "T38 replacing only the pod template's metadata is not flagged"
  tests: [T38]
  proposal:
    spec:
      type: Api
      api:
        requests:
          - {verb: patch, apiVersion: apps/v1, resource: deployments, namespace: payments, name: api, patchType: application/json-patch+json, body: '[{"op":"replace","path":"/spec/template/metadata","value":{"labels":{"app":"api"}}}]'}
          - {verb: patch, apiVersion: apps/v1, resource: deployments, namespace: payments, name: api, patchType: application/json-patch+json, body: '[{"op":"replace","path":"/spec/template/metadata/labels","value":{"app":"api"}}]'}
          - {verb: patch, apiVersion: apps/v1, resource: deployments, namespace: payments, name: api, patchType: application/json-patch+json, body: '[{"op":"replace","path":"/metadata","value":{"labels":{"app":"api"}}}]'}
      justification: A test proposal.
  static: []

# The empty pointer is the root: an ancestor of every field.
- name: 'T38 replacing the whole object is flagged under every field'
