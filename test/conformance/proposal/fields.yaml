# Field rules (base 4.2.1): the workload field protection on create and on each
# patch type (T37), ancestors and descendants (T38), patches that touch
# replicas or resources (T39), deletes (T41), and the fields that are ignored.
# Expected findings come from the spec's field list, in rule paths; a change
# that replaces a whole subtree matches every rule path that can exist beneath
# it in the object's schema.

# One create per protected path of base 6.3. A container's securityContext is also named by **.securityContext, which matches at any depth.
- name: 'WorkloadField: creating a Deployment with each protected field, part 1'
  tests: [T15, T37]
  proposal:
    spec:
      type: Api
      api:
        requests:
          - {verb: create, apiVersion: apps/v1, resource: deployments, namespace: payments, body: '{"metadata":{"name":"api"},"spec":{"template":{"spec":{"containers":[{"name":"a","image":"nginx:1.27"}]}}}}'}
          - {verb: create, apiVersion: apps/v1, resource: deployments, namespace: payments, body: '{"metadata":{"name":"api"},"spec":{"template":{"spec":{"initContainers":[{"name":"i","image":"busybox"}]}}}}'}
          - {verb: create, apiVersion: apps/v1, resource: deployments, namespace: payments, body: '{"metadata":{"name":"api"},"spec":{"template":{"spec":{"ephemeralContainers":[{"name":"dbg","image":"busybox"}]}}}}'}
          - {verb: create, apiVersion: apps/v1, resource: deployments, namespace: payments, body: '{"metadata":{"name":"api"},"spec":{"template":{"spec":{"containers":[{"name":"a","command":["sh"]}]}}}}'}
          - {verb: create, apiVersion: apps/v1, resource: deployments, namespace: payments, body: '{"metadata":{"name":"api"},"spec":{"template":{"spec":{"containers":[{"name":"a","args":["-c"]}]}}}}'}
          - {verb: create, apiVersion: apps/v1, resource: deployments, namespace: payments, body: '{"metadata":{"name":"api"},"spec":{"template":{"spec":{"containers":[{"name":"a","env":[{"name":"A","value":"b"}]}]}}}}'}
          - {verb: create, apiVersion: apps/v1, resource: deployments, namespace: payments, body: '{"metadata":{"name":"api"},"spec":{"template":{"spec":{"containers":[{"name":"a","envFrom":[{"configMapRef":{"name":"cm"}}]}]}}}}'}
          - {verb: create, apiVersion: apps/v1, resource: deployments, namespace: payments, body: '{"metadata":{"name":"api"},"spec":{"template":{"spec":{"containers":[{"name":"a","volumeMounts":[{"name":"v","mountPath":"/data"}]}]}}}}'}
          - {verb: create, apiVersion: apps/v1, resource: deployments, namespace: payments, body: '{"metadata":{"name":"api"},"spec":{"template":{"spec":{"containers":[{"name":"a","securityContext":{"privileged":true}}]}}}}'}
          - {verb: create, apiVersion: apps/v1, resource: deployments, namespace: payments, body: '{"metadata":{"name":"api"},"spec":{"template":{"spec":{"initContainers":[{"name":"a","command":["sh"]}]}}}}'}
          - {verb: create, apiVersion: apps/v1, resource: deployments, namespace: payments, body: '{"metadata":{"name":"api"},"spec":{"template":{"spec":{"initContainers":[{"name":"a","args":["-c"]}]}}}}'}
          - {verb: create, apiVersion: apps/v1, resource: deployments, namespace: payments, body: '{"metadata":{"name":"api"},"spec":{"template":{"spec":{"initContainers":[{"name":"a","env":[{"name":"A","value":"b"}]}]}}}}'}
      justification: A test proposal.
  static:
    - {reason: WorkloadField, request: 0, field: '**.containers[*].image'}
    - {reason: WorkloadField, request: 1, field: '**.initContainers[*].image'}
    - {reason: WorkloadField, request: 2, field: '**.ephemeralContainers[*]'}
    - {reason: WorkloadField, request: 3, field: '**.containers[*].command'}
    - {reason: WorkloadField, request: 4, field: '**.containers[*].args'}
    - {reason: WorkloadField, request: 5, field: '**.containers[*].env'}
    - {reason: WorkloadField, request: 6, field: '**.containers[*].envFrom'}
    - {reason: WorkloadField, request: 7, field: '**.containers[*].volumeMounts'}
    - {reason: WorkloadField, request: 8, field: '**.containers[*].securityContext'}
    - {reason: WorkloadField, request: 8, field: '**.securityContext'}
    - {reason: WorkloadField, request: 9, field: '**.initContainers[*].command'}
    - {reason: WorkloadField, request: 10, field: '**.initContainers[*].args'}
    - {reason: WorkloadField, request: 11, field: '**.initContainers[*].env'}

# One create per protected path of base 6.3. A container's securityContext is also named by **.securityContext, which matches at any depth.
- name: 'WorkloadField: creating a Deployment with each protected field, part 2'
  tests: [T15, T37]
  proposal:
    spec:
      type: Api
      api:
        requests:
          - {verb: create, apiVersion: apps/v1, resource: deployments, namespace: payments, body: '{"metadata":{"name":"api"},"spec":{"template":{"spec":{"initContainers":[{"name":"a","envFrom":[{"configMapRef":{"name":"cm"}}]}]}}}}'}
          - {verb: create, apiVersion: apps/v1, resource: deployments, namespace: payments, body: '{"metadata":{"name":"api"},"spec":{"template":{"spec":{"initContainers":[{"name":"a","volumeMounts":[{"name":"v","mountPath":"/data"}]}]}}}}'}
          - {verb: create, apiVersion: apps/v1, resource: deployments, namespace: payments, body: '{"metadata":{"name":"api"},"spec":{"template":{"spec":{"initContainers":[{"name":"a","securityContext":{"privileged":true}}]}}}}'}
          - {verb: create, apiVersion: apps/v1, resource: deployments, namespace: payments, body: '{"metadata":{"name":"api"},"spec":{"template":{"spec":{"volumes":[{"name":"v","emptyDir":{}}]}}}}'}
          - {verb: create, apiVersion: apps/v1, resource: deployments, namespace: payments, body: '{"metadata":{"name":"api"},"spec":{"template":{"spec":{"serviceAccountName":"admin"}}}}'}
          - {verb: create, apiVersion: apps/v1, resource: deployments, namespace: payments, body: '{"metadata":{"name":"api"},"spec":{"template":{"spec":{"automountServiceAccountToken":false}}}}'}
          - {verb: create, apiVersion: apps/v1, resource: deployments, namespace: payments, body: '{"metadata":{"name":"api"},"spec":{"template":{"spec":{"hostNetwork":true}}}}'}
          - {verb: create, apiVersion: apps/v1, resource: deployments, namespace: payments, body: '{"metadata":{"name":"api"},"spec":{"template":{"spec":{"hostPID":true}}}}'}
          - {verb: create, apiVersion: apps/v1, resource: deployments, namespace: payments, body: '{"metadata":{"name":"api"},"spec":{"template":{"spec":{"hostIPC":true}}}}'}
          - {verb: create, apiVersion: apps/v1, resource: deployments, namespace: payments, body: '{"metadata":{"name":"api"},"spec":{"template":{"spec":{"nodeName":"n1"}}}}'}
          - {verb: create, apiVersion: apps/v1, resource: deployments, namespace: payments, body: '{"metadata":{"name":"api"},"spec":{"template":{"spec":{"securityContext":{"runAsNonRoot":true}}}}}'}
      justification: A test proposal.
  static:
    - {reason: WorkloadField, request: 0, field: '**.initContainers[*].envFrom'}
    - {reason: WorkloadField, request: 1, field: '**.initContainers[*].volumeMounts'}
    - {reason: WorkloadField, request: 2, field: '**.initContainers[*].securityContext'}
    - {reason: WorkloadField, request: 2, field: '**.securityContext'}
    - {reason: WorkloadField, request: 3, field: '**.volumes'}
    - {reason: WorkloadField, request: 4, field: '**.serviceAccountName'}
    - {reason: WorkloadField, request: 5, field: '**.automountServiceAccountToken'}
    - {reason: WorkloadField, request: 6, field: '**.hostNetwork'}
    - {reason: WorkloadField, request: 7, field: '**.hostPID'}
    - {reason: WorkloadField, request: 8, field: '**.hostIPC'}
    - {reason: WorkloadField, request: 9, field: '**.nodeName'}
    - {reason: WorkloadField, request: 10, field: '**.securityContext'}

# nodeSelector is not nodeName; resources, probes and ports are not on the list.
- name: 'WorkloadField near miss: a create with only unprotected fields'
  tests: [T15, T37]
  proposal:
    spec:
      type: Api
      api:
        requests:
          - {verb: create, apiVersion: apps/v1, resource: deployments, namespace: payments, body: '{"apiVersion":"apps/v1","kind":"Deployment","metadata":{"name":"api","labels":{"app":"api"},"annotations":{"a":"b"}},"spec":{"replicas":3,"selector":{"matchLabels":{"app":"api"}},"strategy":{"type":"Recreate"},"template":{"metadata":{"labels":{"app":"api"}},"spec":{"containers":[{"name":"api","resources":{"limits":{"cpu":"1"}},"ports":[{"containerPort":80}],"imagePullPolicy":"Always","livenessProbe":{"httpGet":{"path":"/","port":80}}}],"terminationGracePeriodSeconds":30,"nodeSelector":{"disk":"ssd"},"tolerations":[{"key":"k","operator":"Exists"}],"priorityClassName":"high","dnsPolicy":"ClusterFirst"}}}}'}
      justification: A test proposal.
  static: []

- name: 'T37 JSON Patch: a protected field is flagged, an unprotected one is not'
  tests: [T37]
  proposal:
    spec:
      type: Api
      api:
        requests:
          - {verb: patch, apiVersion: apps/v1, resource: deployments, namespace: payments, name: api, patchType: application/json-patch+json, body: '[{"op":"replace","path":"/spec/template/spec/serviceAccountName","value":"admin"}]'}
          - {verb: patch, apiVersion: apps/v1, resource: deployments, namespace: payments, name: api, patchType: application/json-patch+json, body: '[{"op":"replace","path":"/spec/replicas","value":5}]'}
          - {verb: patch, apiVersion: apps/v1, resource: deployments, namespace: payments, name: api, patchType: application/json-patch+json, body: '[{"op":"add","path":"/spec/template/spec/containers/0/env/-","value":{"name":"A","value":"b"}}]'}
          - {verb: patch, apiVersion: apps/v1, resource: deployments, namespace: payments, name: api, patchType: application/json-patch+json, body: '[{"op":"add","path":"/metadata/labels/team","value":"sre"}]'}
      justification: A test proposal.
  static:
    - {reason: WorkloadField, request: 0, field: '**.serviceAccountName'}
    - {reason: WorkloadField, request: 2, field: '**.containers[*].env'}

- name: 'T37 JSON merge patch: a protected field is flagged, an unprotected one is not'
  tests: [T37]
  proposal:
    spec:
      type: Api
      api:
        requests:
          - {verb: patch, apiVersion: apps/v1, resource: deployments, namespace: payments, name: api, patchType: application/merge-patch+json, body: '{"spec":{"template":{"spec":{"serviceAccountName":"admin"}}}}'}
          - {verb: patch, apiVersion: apps/v1, resource: deployments, namespace: payments, name: api, patchType: application/merge-patch+json, body: '{"spec":{"replicas":5}}'}
          - {verb: patch, apiVersion: apps/v1, resource: deployments, namespace: payments, name: api, patchType: application/merge-patch+json, body: '{"spec":{"template":{"spec":{"hostNetwork":true}}}}'}
          - {verb: patch, apiVersion: apps/v1, resource: deployments, namespace: payments, name: api, patchType: application/merge-patch+json, body: '{"metadata":{"labels":{"team":"sre"}}}'}
      justification: A test proposal.
  static:
    - {reason: WorkloadField, request: 0, field: '**.serviceAccountName'}
    - {reason: WorkloadField, request: 2, field: '**.hostNetwork'}

# A strategic merge patch merges containers by name, so only the image of container api changes (request 2).
- name: 'T37 strategic merge patch: a protected field is flagged, an unprotected one is not'
  tests: [T37]
  proposal:
    spec:
      type: Api
      api:
        requests:
          - {verb: patch, apiVersion: apps/v1, resource: deployments, namespace: payments, name: api, patchType: application/strategic-merge-patch+json, body: '{"spec":{"template":{"spec":{"serviceAccountName":"admin"}}}}'}
          - {verb: patch, apiVersion: apps/v1, resource: deployments, namespace: payments, name: api, patchType: application/strategic-merge-patch+json, body: '{"spec":{"replicas":5}}'}
          - {verb: patch, apiVersion: apps/v1, resource: deployments, namespace: payments, name: api, patchType: application/strategic-merge-patch+json, body: '{"spec":{"template":{"spec":{"containers":[{"name":"api","image":"nginx:1.28"}]}}}}'}
          - {verb: patch, apiVersion: apps/v1, resource: deployments, namespace: payments, name: api, patchType: application/strategic-merge-patch+json, body: '{"spec":{"template":{"metadata":{"annotations":{"kubectl.kubernetes.io/restartedAt":"2026-11-11T09:00:00Z"}}}}}'}
      justification: A test proposal.
  static:
    - {reason: WorkloadField, request: 0, field: '**.serviceAccountName'}
    - {reason: WorkloadField, request: 2, field: '**.containers[*].image'}

# The new value's content isn't looked at: a Subtree change matches each rule path the schema says can exist beneath it. The pod spec of a Pod, Deployment, CronJob and Job can hold all 23 paths, **.serviceAccountName and **.containers[*].image among them. A Pod has no spec.template, so request 0 replaces its spec.
- name: 'T38 replacing a whole pod template by JSON Patch is flagged under every field that can exist in it'
  tests: [T38, T37]
  proposal:
    spec:
      type: Api
      api:
        requests:
