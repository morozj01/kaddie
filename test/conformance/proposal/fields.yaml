          - {verb: patch, apiVersion: apps/v1, resource: deployments, namespace: payments, name: api, patchType: application/json-patch+json, body: '[{"op":"replace","path":"/spec/template","value":{"spec":{"containers":[{"name":"a","image":"x"}]}}}]'}
          - {verb: patch, apiVersion: batch/v1, resource: cronjobs, namespace: payments, name: nightly, patchType: application/json-patch+json, body: '[{"op":"replace","path":"/spec/jobTemplate/spec/template","value":{"spec":{"containers":[{"name":"a","image":"x"}]}}}]'}
