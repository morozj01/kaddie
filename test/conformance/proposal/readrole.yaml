# The kaddie-agent-read exception (base 5.4.4) and what stays an RBAC finding
# (T25, static part; exact evaluation of the resulting role is T2.6). A patch
# of the ClusterRole kaddie-agent-read is exempt from the RBAC protection
# when every operation adds, replaces or removes whole rules and every rule it
# writes passes the read-role rule: verbs a subset of get, list and watch (and
# not empty), no wildcard in apiGroups, resources or verbs, no resourceNames or
# nonResourceURLs, no secrets (any group), serviceaccounts/token,
# certificatesigningrequests/approval or */exec, */attach, */portforward,
# */proxy, no rbac.authorization.k8s.io group, and the kaddie.org group only
# for sreproposals. When the patch targets that role and breaks the rule the
# finding is ReadRoleRule; everything else touching RBAC is RBAC.

# Every patch type, appending, inserting, replacing one rule or the list, removing a rule, a test guard, several operations, and a patch that leaves no rules.
- name: 'T25 patches that only add, replace or remove whole passing rules are not flagged'
  tests: [T25, T15]
  proposal:
    spec:
      type: Api
      api:
        requests:
          - {verb: patch, apiVersion: rbac.authorization.k8s.io/v1, resource: clusterroles, name: kaddie-agent-read, patchType: application/json-patch+json, body: '[{"op":"add","path":"/rules/-","value":{"apiGroups":["cert-manager.io"],"resources":["certificates"],"verbs":["get","list","watch"]}}]'}
          - {verb: patch, apiVersion: rbac.authorization.k8s.io/v1, resource: clusterroles, name: kaddie-agent-read, patchType: application/json-patch+json, body: '[{"op":"add","path":"/rules/0","value":{"apiGroups":[""],"resources":["pods/log"],"verbs":["get"]}}]'}
          - {verb: patch, apiVersion: rbac.authorization.k8s.io/v1, resource: clusterroles, name: kaddie-agent-read, patchType: application/json-patch+json, body: '[{"op":"replace","path":"/rules/3","value":{"apiGroups":["kaddie.org"],"resources":["sreproposals"],"verbs":["get","list","watch"]}}]'}
          - {verb: patch, apiVersion: rbac.authorization.k8s.io/v1, resource: clusterroles, name: kaddie-agent-read, patchType: application/json-patch+json, body: '[{"op":"replace","path":"/rules","value":[{"apiGroups":["cert-manager.io"],"resources":["certificates"],"verbs":["get","list","watch"]},{"apiGroups":[""],"resources":["pods/log"],"verbs":["get"]}]}]'}
          - {verb: patch, apiVersion: rbac.authorization.k8s.io/v1, resource: clusterroles, name: kaddie-agent-read, patchType: application/json-patch+json, body: '[{"op":"remove","path":"/rules/20"}]'}
          - {verb: patch, apiVersion: rbac.authorization.k8s.io/v1, resource: clusterroles, name: kaddie-agent-read, patchType: application/json-patch+json, body: '[{"op":"test","path":"/rules/20","value":{"apiGroups":["cert-manager.io"],"resources":["certificates"],"verbs":["get","list","watch"]}},{"op":"add","path":"/rules/-","value":{"apiGroups":["apps"],"resources":["deployments/status"],"verbs":["get","watch"]}}]'}
          - {verb: patch, apiVersion: rbac.authorization.k8s.io/v1, resource: clusterroles, name: kaddie-agent-read, patchType: application/json-patch+json, body: '[{"op":"remove","path":"/rules/1"},{"op":"add","path":"/rules/-","value":{"apiGroups":["cert-manager.io"],"resources":["certificates"],"verbs":["get","list","watch"]}},{"op":"add","path":"/rules/-","value":{"apiGroups":[""],"resources":["pods/log"],"verbs":["get"]}}]'}
          - {verb: patch, apiVersion: rbac.authorization.k8s.io/v1, resource: clusterroles, name: kaddie-agent-read, patchType: application/merge-patch+json, body: '{"rules":[{"apiGroups":["cert-manager.io"],"resources":["certificates"],"verbs":["get","list","watch"]},{"apiGroups":[""],"resources":["pods/log"],"verbs":["get"]}]}'}
          - {verb: patch, apiVersion: rbac.authorization.k8s.io/v1, resource: clusterroles, name: kaddie-agent-read, patchType: application/strategic-merge-patch+json, body: '{"rules":[{"apiGroups":["cert-manager.io"],"resources":["certificates"],"verbs":["get","list","watch"]}]}'}
          - {verb: patch, apiVersion: rbac.authorization.k8s.io/v1, resource: clusterroles, name: kaddie-agent-read, patchType: application/merge-patch+json, body: '{"rules":[]}'}
      justification: A test proposal.
  static: []

