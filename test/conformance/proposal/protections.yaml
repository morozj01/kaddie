# Built-in protections (base 6.3), one match vector and one near-miss vector
# each (T15), and the match-field semantics of base 4.2 as the catalogue uses
# them (T12, T14). Expected findings are derived from the spec's catalogue, not
# from running the engine. A vector's `request` is the index in
# spec.api.requests, -1 for the proposal itself.

# The rule lists only apiGroups, so every verb and namespace matches (T12: omitted fields match anything).
- name: 'KaddieGroup: any object of kaddie.org, whatever the verb'
  tests: [T15, T12]
  proposal:
    spec:
      type: Api
      api:
        requests:
          - {verb: patch, apiVersion: kaddie.org/v1alpha1, resource: sreconfigs, name: default, patchType: application/merge-patch+json, body: '{"spec":{"mode":"Halted"}}'}
          - {verb: create, apiVersion: kaddie.org/v1alpha1, resource: sretriggers, namespace: payments, body: '{"metadata":{"name":"t"},"spec":{}}'}
          - {verb: delete, apiVersion: kaddie.org/v1alpha1, resource: sreproposals, namespace: payments, name: old}
      justification: A test proposal.
  static:
    - {reason: KaddieGroup, request: 0}
    - {reason: KaddieGroup, request: 1}
    - {reason: KaddieGroup, request: 2}

# kaddie.io and foo.kaddie.org are other groups; apiGroups match exactly.
- name: 'KaddieGroup near miss: lookalike groups'
  tests: [T15, T12]
  proposal:
    spec:
      type: Api
      api:
        requests:
          - {verb: create, apiVersion: kaddie.io/v1, resource: widgets, namespace: payments, body: '{"metadata":{"name":"w"}}'}
          - {verb: create, apiVersion: foo.kaddie.org/v1, resource: widgets, namespace: payments, body: '{"metadata":{"name":"w"}}'}
      justification: A test proposal.
  static: []

# Request 1 is the namespaces resource, which is in the namespace its name names; request 2 asks for payments but its body says kaddie-system.
- name: 'KaddieNamespace: objects in kaddie-system and the namespace itself'
  tests: [T15, T12]
  proposal:
    spec:
      type: Api
      api:
        requests:
          - {verb: patch, apiVersion: v1, resource: configmaps, namespace: kaddie-system, name: c, patchType: application/merge-patch+json, body: '{"data":{"a":"b"}}'}
          - {verb: patch, apiVersion: v1, resource: namespaces, name: kaddie-system, patchType: application/merge-patch+json, body: '{"metadata":{"labels":{"a":"b"}}}'}
          - {verb: create, apiVersion: v1, resource: configmaps, namespace: payments, body: '{"metadata":{"name":"c","namespace":"kaddie-system"},"data":{"a":"b"}}'}
          - {verb: delete, apiVersion: apps/v1, resource: deployments, namespace: kaddie-system, name: api}
      justification: A test proposal.
  static:
    - {reason: KaddieNamespace, request: 0}
    - {reason: KaddieNamespace, request: 1}
    - {reason: KaddieNamespace, request: 2}
    - {reason: KaddieNamespace, request: 3}

# Namespaces match exactly; only generateName and names use prefixes.
- name: 'KaddieNamespace near miss: other namespaces with similar names'
  tests: [T15, T12]
  proposal:
    spec:
