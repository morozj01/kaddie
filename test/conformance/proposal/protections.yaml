      api:
        requests:
          - {verb: patch, apiVersion: v1, resource: configmaps, namespace: kaddie-systems, name: c, patchType: application/merge-patch+json, body: '{"data":{"a":"b"}}'}
          - {verb: patch, apiVersion: v1, resource: namespaces, name: kaddie, patchType: application/merge-patch+json, body: '{"metadata":{"labels":{"a":"b"}}}'}
          - {verb: patch, apiVersion: v1, resource: configmaps, namespace: kaddie-system-old, name: c, patchType: application/merge-patch+json, body: '{"data":{"a":"b"}}'}
      justification: A test proposal.
  static: []

