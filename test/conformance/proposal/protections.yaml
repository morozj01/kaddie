# A rule resource of the form r/sub matches that subresource of r.
- name: 'ServiceAccountToken: minting a token'
  tests: [T15, T12]
  proposal:
    spec:
      type: Api
      api:
        requests:
          - {verb: create, apiVersion: v1, resource: serviceaccounts, subresource: token, namespace: payments, name: app, body: '{"apiVersion":"authentication.k8s.io/v1","kind":"TokenRequest","spec":{"audiences":["https://kubernetes.default.svc"]}}'}
      justification: A test proposal.
  static:
