version: "2"

run:
  timeout: 5m
  build-tags:
    - e2e
    - envtest

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - gosec
    - misspell
    - nolintlint
    - revive
    - unconvert
    - unparam
  settings:
    nolintlint:
      require-explanation: true
      require-specific: true
    revive:
      rules:
        - name: exported
          disabled: true
    gosec:
      excludes:
        # Tests and test infrastructure shell out to kubectl, helm, kind and docker.
        - G204
  exclusions:
    generated: strict
    presets:
      - comments
      - std-error-handling
    rules:
      - path: _test\.go
        linters: [gosec, unparam]
      - path: ^test/
        linters: [gosec]
      # Developer tools: every path comes from the command line or the repo.
      - path: ^hack/
        linters: [gosec]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/morozj01/kaddie
