{{- /*
The one human role (base §5.2). Self-contained, so each person needs exactly
one binding. It grants nothing on target resources: executing a proposal
relies on the operator's own, separately granted RBAC.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kaddie-operator
  labels:
    {{- include "kaddie.labels" . | nindent 4 }}
rules:
  {{- include "kaddie.rules.config-read" . | nindent 2 }}
  {{- include "kaddie.rules.proposal-read" . | nindent 2 }}
  {{- include "kaddie.rules.trigger-read" . | nindent 2 }}
  {{- include "kaddie.rules.proposal-status-write" . | nindent 2 }}
  {{- include "kaddie.rules.session-use" . | nindent 2 }}
  {{- include "kaddie.rules.config-create" . | nindent 2 }}
  {{- include "kaddie.rules.config-update" . | nindent 2 }}
  {{- include "kaddie.rules.trigger-manage" . | nindent 2 }}
  {{- include "kaddie.rules.read-scope-edit" . | nindent 2 }}
  {{- include "kaddie.rules.session-delete" . | nindent 2 }}
