{{- /*
Human bindings come only from rbac.operators, empty by default (base §5.2,
T5). A ClusterRoleBinding, because sreconfigs and sretriggers are
cluster-scoped.
*/}}
{{- with .Values.rbac.operators }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kaddie-operator
  labels:
    {{- include "kaddie.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kaddie-operator
subjects:
  {{- range . }}
  - kind: {{ .kind }}
    name: {{ .name | quote }}
    {{- if eq .kind "ServiceAccount" }}
    namespace: {{ required "rbac.operators: a ServiceAccount subject needs a namespace" .namespace | quote }}
    {{- else }}
    apiGroup: {{ .apiGroup | default "rbac.authorization.k8s.io" }}
    {{- end }}
  {{- end }}
{{- end }}
