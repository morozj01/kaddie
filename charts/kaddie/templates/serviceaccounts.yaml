{{- /*
One ServiceAccount per component (Architecture §6.1). kaddie-ui and
kaddie-renderer never mount a default-audience token: kaddie-ui projects only
a kaddie-sessions-audience token, and kaddie-renderer projects its token into
the controller container only. kaddie-agent's pod turns automount off itself
(base §3.4).
*/}}
{{- $noAutomount := list "kaddie-ui" "kaddie-renderer" }}
{{- range $name := include "kaddie.components" . | fromJsonArray }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ include "kaddie.namespace" $ }}
  labels:
    {{- include "kaddie.labels" $ | nindent 4 }}
{{- if has $name $noAutomount }}
automountServiceAccountToken: false
{{- end }}
{{- end }}
